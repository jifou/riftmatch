limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

upstream payload {
    server payload:3000;
}

upstream astro {
    server astro:4321;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 20M;

    # Derrière Traefik : récupérer la vraie IP du visiteur (sinon la limite de débit
    # du login serait partagée par tout le monde, avec l'IP de Traefik).
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Compression (HTML, JSON, CSS, JS, SVG, XML du sitemap)
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/xml+rss image/svg+xml;

    # En-têtes de sécurité (Traefik termine le TLS devant)
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Transmettre les headers Traefik aux upstreams
    # (Traefik ajoute X-Forwarded-Proto: https — Astro en a besoin pour les URLs canoniques)
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    # Payload CMS admin & API
    location = /api/users/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://payload;
        proxy_http_version 1.1;
    }

    location /admin {
        proxy_pass http://payload;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }

    location /api {
        proxy_pass http://payload;
        proxy_http_version 1.1;
    }

    # Astro frontend — everything else
    location / {
        proxy_pass http://astro;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }
}
